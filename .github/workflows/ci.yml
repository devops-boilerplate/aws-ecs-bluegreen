name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull request runs, but never cancel a deployment: this
  # workflow is also called by deploy.yml, and a called workflow's concurrency
  # group applies to the caller's run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-north-1

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  app-quality:
    name: App quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail

          ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSL "${BASE}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
          curl -fsSL "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks_checksums.txt

          (cd /tmp && grep -F "  ${ARCHIVE}" gitleaks_checksums.txt | sha256sum -c -)

          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for leaked secrets
        run: gitleaks git . --no-banner --redact --exit-code 1

  dependency-and-iac-scan:
    name: Dependency and IaC scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Scan dependencies and secrets (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Report infrastructure misconfigurations (non-blocking)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 0
          format: table

  terraform-format:
    name: Terraform format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5

      - name: Check formatting
        run: terraform fmt -check -recursive infra

  terraform-validate:
    name: Terraform validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]

    defaults:
      run:
        working-directory: infra/live/${{ matrix.environment }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5

      - name: Init without backend
        run: terraform init -backend=false -input=false -no-color

      - name: Validate
        run: terraform validate -no-color

  terraform-validate-bootstrap:
    name: Terraform validate (bootstrap)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infra/bootstrap

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5

      - name: Init without backend
        run: terraform init -backend=false -input=false -no-color

      - name: Validate
        run: terraform validate -no-color

  terraform-plan:
    name: Terraform plan (dev)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev

    defaults:
      run:
        working-directory: infra/live/dev

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Check whether the dev environment is configured
        id: config
        env:
          ROLE_ARN: ${{ vars.TERRAFORM_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Terraform plan skipped::Set the dev environment variables (scripts/setup-github-env.sh) to enable this gate."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        if: steps.config.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5

      - name: Init
        if: steps.config.outputs.configured == 'true'
        run: terraform init -input=false -no-color

      - name: Plan
        if: steps.config.outputs.configured == 'true'
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m -var-file=dev.tfvars -out=tfplan | tee plan.txt

      - name: Publish plan to the job summary
        if: always()
        run: |
          {
            echo "### Terraform plan (dev)"
            echo
            echo '```'
            head -c 100000 plan.txt 2>/dev/null || echo "No plan output produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
