name: Main guard

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  require-merged-pr:
    name: Require a merged pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify the commit is associated with a merged pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          COUNT=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --jq "[.[] | select(.merged_at != null and .base.ref == \"main\" and .merge_commit_sha == \"${SHA}\")] | length")

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::Direct push to main detected: ${SHA} is not the merge commit of a pull request."
            echo "::error::Use a pull request. Enable branch protection when the repository plan supports it (./scripts/protect-main.sh)."
            exit 1
          fi

          echo "Commit ${SHA} comes from a merged pull request."
