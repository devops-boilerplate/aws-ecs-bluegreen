name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to roll back
        type: choice
        options: [dev, prod]
        required: true
        default: dev
      revision:
        description: Task definition revision number to redeploy (for example 12)
        type: string
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    name: Rollback ${{ inputs.environment }} to revision ${{ inputs.revision }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      TASK_DEFINITION_FAMILY: ${{ vars.TASK_DEFINITION_FAMILY }}
      CODEDEPLOY_APPLICATION: ${{ vars.CODEDEPLOY_APPLICATION }}
      CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.CODEDEPLOY_DEPLOYMENT_GROUP }}
      ALB_NAME: ${{ vars.ALB_NAME }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
      CONTAINER_PORT: ${{ vars.CONTAINER_PORT }}
      INPUT_REVISION: ${{ inputs.revision }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve the target task definition
        run: |
          set -euo pipefail

          if [[ ! "${INPUT_REVISION}" =~ ^[0-9]+$ ]]; then
            echo "::error::revision must be a numeric task definition revision."
            exit 1
          fi

          TASK_DEFINITION_ARN=$(aws ecs describe-task-definition \
            --task-definition "${TASK_DEFINITION_FAMILY}:${INPUT_REVISION}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          IMAGE=$(aws ecs describe-task-definition \
            --task-definition "${TASK_DEFINITION_ARN}" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text)

          echo "Rolling ${ECS_SERVICE} back to ${TASK_DEFINITION_ARN}"
          echo "Image: ${IMAGE}"

          echo "TASK_DEFINITION_ARN=${TASK_DEFINITION_ARN}" >> "$GITHUB_ENV"
          {
            echo "### Rollback target"
            echo
            echo "- Task definition: \`${TASK_DEFINITION_ARN}\`"
            echo "- Image: \`${IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the CodeDeploy deployment
        run: |
          set -euo pipefail

          jq -n \
            --arg task_definition "$TASK_DEFINITION_ARN" \
            --arg container_name "$CONTAINER_NAME" \
            --argjson container_port "$CONTAINER_PORT" \
            '{
              version: "0.0",
              Resources: [{
                TargetService: {
                  Type: "AWS::ECS::Service",
                  Properties: {
                    TaskDefinition: $task_definition,
                    LoadBalancerInfo: {
                      ContainerName: $container_name,
                      ContainerPort: $container_port
                    }
                  }
                }
              }]
            }' > appspec.json

          jq -n --arg content "$(cat appspec.json)" \
            '{revisionType: "AppSpecContent", appSpecContent: {content: $content}}' > revision.json

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_DEPLOYMENT_GROUP" \
            --description "Rollback to revision ${INPUT_REVISION} via GitHub Actions" \
            --revision file://revision.json \
            --query 'deploymentId' \
            --output text)

          echo "DEPLOYMENT_ID=${DEPLOYMENT_ID}" >> "$GITHUB_ENV"
          echo "CodeDeploy deployment ${DEPLOYMENT_ID} created"

          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"

      - name: Resolve the load balancer DNS name
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "ALB_DNS=${ALB_DNS}" >> "$GITHUB_ENV"

      - name: Smoke test through the load balancer
        env:
          SMOKE_ATTEMPTS: "20"
          SMOKE_DELAY_SECONDS: "6"
        run: ./scripts/smoke-test.sh "http://${ALB_DNS}"

      - name: Deployment diagnostics
        if: failure()
        run: |
          if [ -n "${DEPLOYMENT_ID:-}" ]; then
            aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" --output json || true
          fi

          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{status:status,desired:desiredCount,running:runningCount,deployments:deployments[].{status:status,rollout:rolloutState,taskDefinition:taskDefinition}}' \
            --output json || true
