name: Infrastructure

on:
  workflow_call:
    inputs:
      environment:
        description: Environment to run Terraform against
        type: string
        required: true
      operation:
        description: plan or apply
        type: string
        default: plan
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to run Terraform against
        type: choice
        options: [dev, prod]
        required: true
        default: dev
      operation:
        description: plan or apply
        type: choice
        options: [plan, apply]
        required: true
        default: plan

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform ${{ inputs.operation }} (${{ inputs.environment }})
    if: inputs.environment != 'dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false

    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.5

      - name: Init
        run: terraform init -input=false -no-color

      - name: Check formatting
        run: terraform fmt -check -recursive ../..

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m -var-file=${{ inputs.environment }}.tfvars -out=tfplan | tee plan.txt

      - name: Publish plan to the job summary
        if: always()
        run: |
          {
            echo "### Terraform plan (${{ inputs.environment }})"
            echo
            echo '```'
            head -c 200000 plan.txt 2>/dev/null || echo "No plan output produced."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        if: inputs.operation == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m -auto-approve tfplan
