name: Deploy environment

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (dev or prod)
        type: string
        required: true
      image_tag:
        description: Immutable image tag to build and push
        type: string
        required: true
    outputs:
      image:
        description: Image reference that was deployed
        value: ${{ jobs.deploy.outputs.image }}
      digest:
        description: Digest that was deployed
        value: ${{ jobs.deploy.outputs.digest }}
      deployment_id:
        description: CodeDeploy deployment ID
        value: ${{ jobs.deploy.outputs.deployment_id }}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  deploy:
    name: Build and deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      TASK_DEFINITION_FAMILY: ${{ vars.TASK_DEFINITION_FAMILY }}
      CODEDEPLOY_APPLICATION: ${{ vars.CODEDEPLOY_APPLICATION }}
      CODEDEPLOY_DEPLOYMENT_GROUP: ${{ vars.CODEDEPLOY_DEPLOYMENT_GROUP }}
      ALB_NAME: ${{ vars.ALB_NAME }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME }}
      CONTAINER_PORT: ${{ vars.CONTAINER_PORT }}

    outputs:
      image: ${{ steps.image.outputs.ref }}
      digest: ${{ steps.platform.outputs.digest }}
      deployment_id: ${{ steps.release.outputs.deployment_id }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image reference
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ inputs.image_tag }}
        run: |
          echo "ref=${REGISTRY}/${REPOSITORY}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${REGISTRY}/${REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check whether the image tag already exists
        id: existing
        env:
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail

          DIGEST=$(aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)

          if [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "Image already published: ${REPOSITORY}@${DIGEST}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No image published yet for tag ${TAG}"
          fi

      - name: Build and push the ARM64 image
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: APP_VERSION=${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: false

      - name: Resolve the deployed digest
        id: digest
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          DIGEST="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if [ -z "$DIGEST" ]; then
            echo "::error::Unable to resolve the image digest."
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Resolve the linux/arm64 manifest digest
        id: platform
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          INDEX_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail

          MANIFEST=$(docker buildx imagetools inspect "${IMAGE_REF}@${INDEX_DIGEST}" --format '{{json .Manifest}}')
          if jq -e '.manifests' >/dev/null 2>&1 <<<"$MANIFEST"; then
            DIGEST=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<<"$MANIFEST" | head -n1)
          else
            DIGEST="$INDEX_DIGEST"
          fi

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "::error::Unable to resolve the linux/arm64 manifest digest."
            exit 1
          fi

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE_REF}@${DIGEST}"

      - name: Scan the image (blocking on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}@${{ steps.platform.outputs.digest }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.ref }}@${{ steps.platform.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ inputs.environment }}-${{ inputs.image_tag }}.spdx.json
          output-file: sbom-${{ inputs.environment }}.spdx.json

      - name: Note GitHub attestation availability
        if: github.event.repository.private
        run: echo "::notice title=GitHub attestation skipped::GitHub artifact attestations require a public repository. The image carries a BuildKit provenance attestation instead."

      - name: Attest build provenance (GitHub)
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.platform.outputs.digest }}

      - name: Download the current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_FAMILY" \
            --query taskDefinition \
            --output json > task-definition.json

      - name: Render the new image into the task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.ref }}@${{ steps.platform.outputs.digest }}

      - name: Register the task definition and create the CodeDeploy deployment
        id: release
        env:
          RENDERED: ${{ steps.render.outputs.task-definition }}
        run: |
          set -euo pipefail

          # Strip the read-only fields returned by DescribeTaskDefinition.
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .deregisteredAt
          )' "$RENDERED" > register.json

          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://register.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered ${TASK_DEFINITION_ARN}"

          jq -n \
            --arg task_definition "$TASK_DEFINITION_ARN" \
            --arg container_name "$CONTAINER_NAME" \
            --argjson container_port "$CONTAINER_PORT" \
            '{
              version: "0.0",
              Resources: [{
                TargetService: {
                  Type: "AWS::ECS::Service",
                  Properties: {
                    TaskDefinition: $task_definition,
                    LoadBalancerInfo: {
                      ContainerName: $container_name,
                      ContainerPort: $container_port
                    }
                  }
                }
              }]
            }' > appspec.json

          jq -n --arg content "$(cat appspec.json)" \
            '{revisionType: "AppSpecContent", appSpecContent: {content: $content}}' > revision.json

          DEPLOYMENT_ID=$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_DEPLOYMENT_GROUP" \
            --description "GitHub Actions ${GITHUB_REPOSITORY} ${GITHUB_SHA::7}" \
            --revision file://revision.json \
            --query 'deploymentId' \
            --output text)

          echo "DEPLOYMENT_ID=${DEPLOYMENT_ID}" >> "$GITHUB_ENV"
          echo "deployment_id=${DEPLOYMENT_ID}" >> "$GITHUB_OUTPUT"
          echo "CodeDeploy deployment ${DEPLOYMENT_ID} created"

          aws deploy wait deployment-successful --deployment-id "$DEPLOYMENT_ID"

      - name: Resolve the load balancer DNS name
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "$ALB_NAME" \
            --query 'LoadBalancers[0].DNSName' \
            --output text)
          echo "ALB_DNS=${ALB_DNS}" >> "$GITHUB_ENV"

      - name: Smoke test through the load balancer
        env:
          SMOKE_ATTEMPTS: "20"
          SMOKE_DELAY_SECONDS: "6"
        run: ./scripts/smoke-test.sh "http://${ALB_DNS}"

      - name: Deployment diagnostics
        if: failure()
        run: |
          if [ -n "${DEPLOYMENT_ID:-}" ]; then
            echo "::group::CodeDeploy deployment"
            aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" --output json || true
            echo "::endgroup::"
          fi

          echo "::group::ECS service"
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].{status:status,desired:desiredCount,running:runningCount,failed:failedTasks,deployments:deployments[].{status:status,rollout:rolloutState,taskDefinition:taskDefinition}}' \
            --output json || true
          echo "::endgroup::"

          echo "::group::Recent container logs"
          STREAM=$(aws logs describe-log-streams \
            --log-group-name "/ecs/${ECS_CLUSTER}" \
            --order-by LastEventTime \
            --descending \
            --max-items 1 \
            --query 'logStreams[0].logStreamName' \
            --output text 2>/dev/null || true)
          if [ -n "$STREAM" ] && [ "$STREAM" != "None" ]; then
            aws logs get-log-events \
              --log-group-name "/ecs/${ECS_CLUSTER}" \
              --log-stream-name "$STREAM" \
              --limit 50 \
              --query 'events[].message' \
              --output text || true
          fi
          echo "::endgroup::"
